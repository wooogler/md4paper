[project]
name = "narani"
version = "0.1.0"
description = "논문 PDF를 구조가 정리된 마크다운으로 바꾸고, 모국어 번역과 나란히 읽게 하는 도구"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.4",
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "markdown-it-py>=3.0",
    "httpx>=0.27",
    # PDF 페이지 렌더(웹 UI 대조 뷰)·페이지 수·텍스트 레이어 판독. docling도 쓰는 PDFium 바인딩이라
    # 추가 설치 부담이 없고, PyMuPDF(AGPL)와 달리 BSD-3/Apache-2.0이라 라이선스 제약이 없다.
    "pypdfium2>=4",
    # PDF 추출 백엔드 — docling(MIT). torch 등 무거운 스택을 동반하지만 단일 백엔드로 유지.
    # 2.140 하한: 그 전(2.114 + docling-parse 7.8)은 글꼴이 바뀌는 자리마다 줄 셀을 끊어 공백을 끼우고
    # ("Decision Points ."), 어떤 줄은 띄어쓰기를 통째로 놓쳤다("Wedefine", "ACMReference").
    "docling>=2.140",
    # opencv 상한 고정: docling의 rapidocr가 opencv-python(상한 없음)을 요구해 깨진 5.0.0.93이
    # 뽑히면 'cv2 has no attribute setNumThreads'로 변환이 실패한다. 정상 바이너리가 있는 4.x로 제한.
    "opencv-python>=4.6,<5",
    # 새 rapidocr(3.10~)는 headless 판을 요구한다. 두 패키지가 같은 cv2 폴더를 쓰므로, 이쪽만 5.x로
    # 깔리면 설치 순서에 따라 깨진 cv2가 덮어쓴다 — 같은 상한으로 묶는다.
    "opencv-python-headless>=4.6,<5",
    # LLM SDKs — 순수 HTTP 클라이언트라 가벼움 (translate/cite에서 사용)
    # 하한은 pydantic-ai-slim 2.59(agent extra)가 요구하는 메이저에 맞춘다 — 그보다 낮으면 해석이 갈라진다.
    "openai>=3.26",
    "anthropic>=1.12",
    "google-genai>=2.30",
    # BibTeX 생성·검증 — 저장 위치의 references.bib에 쌓는 항목을 직접 문자열로 짜지 않는다.
    # 이스케이프(&, %, _, 악센트)·직렬화·되읽기 검증을 이 라이브러리에 맡긴다 (순수 파이썬, MIT).
    "bibtexparser>=1.4",
    "pypdf>=5",
]

[project.optional-dependencies]
# 로컬 웹 UI (latex2mathml: 수식 → MathML 렌더)
# mdit-py-plugins: 변환 탭 프리뷰의 $...$ 수식(dollarmath). markdown-it-py만 끌고 오는데
# 그건 이미 필수 의존성이라 새로 받는 것이 사실상 없다.
# 에이전트 창이 UI 안에 있으므로 ui는 agent를 함께 끌어온다.
ui = [
    "nicegui>=3.14", "watchfiles>=0.21", "latex2mathml>=3.77", "mdit-py-plugins>=0.4",
    "narani[agent]",
]
# 참고문헌 enrichment
enrich = ["httpx>=0.27"]
# 데스크톱 앱 창 (pywebview) — `narani ui --native`, `narani app`가 만드는 런처가 쓴다
native = ["pywebview>=5.4"]
# 에이전트 창 하네스 — tool 승인(deferred tools)·스트리밍 이벤트·세 프로바이더 모델 래퍼
agent = ["pydantic-ai-slim[openai,anthropic,google]>=2.59"]

[project.scripts]
narani = "narani.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narani"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
